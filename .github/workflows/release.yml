name: Build & Publish APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          ./gradlew assembleRelease --no-daemon
          -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}
          -PAPP_VERSION_CODE=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: >
          cp app/build/outputs/apk/release/app-release.apk
          "HeadFi-v${{ steps.version.outputs.name }}.apk"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          files: HeadFi-*.apk
          make_latest: true
          body: |
            **Head-Fi for Android (Unofficial) v${{ steps.version.outputs.name }}**

            ⚠️ **Unofficial app, built for personal convenience.** This project is
            not affiliated with, endorsed by, or connected to Head-Fi.org in any
            way. "Head-Fi" and the Head-Fi logo are the property of their
            respective owners. Use at your own risk.

            | | |
            |---|---|
            | **Version** | ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}) |
            | **Requires** | Android 8.0+ (best on Android 12+ with Material You) |
            | **Signed with** | The project's committed release key — installs/updates cleanly over previous releases |
