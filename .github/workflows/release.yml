name: Build & Publish APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          # Offset keeps published versionCodes above locally side-loaded test
          # builds (the native reader was developed against a phone). It must
          # only ever increase.
          echo "code=$(( $(git rev-list --count HEAD) + 20 ))" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: >
          ./gradlew assembleRelease --no-daemon
          -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}
          -PAPP_VERSION_CODE=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: >
          cp app/build/outputs/apk/release/app-release.apk
          "HeadFi-v${{ steps.version.outputs.name }}.apk"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          files: HeadFi-*.apk
          # Tags with a hyphen are pre-releases (e.g. v1.6.0-beta): they should
          # not become the repo's "Latest release", which stays on the last stable
          # vX.Y.Z until a stable tag is pushed.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            **Head-Fi for Android (Unofficial) v${{ steps.version.outputs.name }}**

            ${{ contains(github.ref_name, '-') && '> **Beta build.** The native reader is a preview: forums, threads and alerts render as app screens instead of the website. If anything looks wrong, switch it off under Account & Settings → Reading & Layout → Native reader and the app behaves like the previous release.' || '' }}

            ⚠️ **Unofficial app, built for personal convenience.** This project is
            not affiliated with, endorsed by, or connected to Head-Fi.org in any
            way. "Head-Fi" and the Head-Fi logo are the property of their
            respective owners. Use at your own risk.

            | | |
            |---|---|
            | **Version** | ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }}) |
            | **Requires** | Android 8.0+ (best on Android 12+ with Material You) |
            | **Signed with** | The project's committed release key — installs/updates cleanly over previous releases |
